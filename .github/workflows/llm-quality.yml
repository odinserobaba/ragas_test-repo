name: LLM quality gates (RAGAS)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  ragas-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Убрать предупреждение про Node.js 20 (deprecation)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      # Secrets
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: mistral-small-latest
      MISTRAL_BASE_URL: https://api.mistral.ai/v1
      RAGAS_CONCURRENCY: "1"
      MIN_FAITHFULNESS: "0.70"
      MIN_ANSWER_RELEVANCY: "0.60"
      MIN_CONTEXT_RECALL: "0.70"
      EMBEDDINGS_MODEL: all-MiniLM-L6-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check requirements.txt
        run: |
          if [ ! -f requirements.txt ]; then
            echo "::error::requirements.txt not found in repo root. Add it and push."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # явно без кэша, чтобы шаг не падал из‑за поиска requirements.txt
          cache: ""

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare reports directory
        run: mkdir -p reports && touch reports/.gitkeep

      - name: Run tests (quality gates)
        run: pytest -q

      - name: Upload RAGAS report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-reports
          path: reports/
          if-no-files-found: ignore
